server:
  port: 8081

spring:
  application:
    name: fileingestionservice
  datasource:
    url: jdbc:postgresql://localhost:5432/retail_db
    username: postgres
    password: secretpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  cloud:
    azure:
      storage:
        blob:
          connection-string: "DefaultEndpointsProtocol=https;AccountName=filestorageaccount1997;AccountKey=JNwiedU79cBPdCsiLJSDnceDfqrUoRg5dwhoFdcq3y1/NFeDAKHAGdrq9TRzITZbTyjdj/DTgs3q+AStFpT10A==;EndpointSuffix=core.windows.net"
          container-name: "files-artifact-container"

    stream:
      bindings:
        fileIngestionOut-out-0:
          destination: retail.file.ingested.exchange
          producer:
            use-native-routing: true
      rabbit:
        binder:
          connection-string: amqp://guest:guest@localhost:5672
        bindings:
          fileIngestionOut-out-0:
            producer:
              exchange-type: topic
              routing-key: file.ingested

logging:
  level:
    com.azure.storage.blob: INFO
    org.hibernate.SQL: DEBUG